<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara's Flashcards</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#FFF8E7">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:#FFF8E7;color:#2D2A4A}
#app{max-width:640px;margin:auto;padding:12px 16px 110px}
h1{font-size:26px;font-weight:800;margin:8px 0;flex:1}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:28px;padding:14px 18px;color:#fff;background:#9B5DE5;cursor:pointer;text-align:center}
button:disabled{opacity:.35}
.coral{background:#FF6B6B}.sky{background:#4D96FF}.mint{background:#3FBF6A}.sun{background:#FFD93D;color:#2D2A4A}
header,.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
header button,.bar button,.bar .btn{background:none;color:#2D2A4A;padding:8px 12px}
.tile{display:flex;align-items:center;gap:12px;color:#fff;border-radius:28px;padding:16px;margin:12px 0;cursor:pointer;box-shadow:0 3px 6px #0003}
.tile>div{flex:1;font-weight:600}.tile b{font-size:21px}.em{font-size:30px}
.tile button{background:#fff3;padding:8px 10px}
.crow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #9B5DE5;border-radius:20px;padding:8px 12px;margin:10px 0}
.crow>div{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow input{width:22px;height:22px}
.crow button{background:none;padding:6px}
.fab{position:fixed;right:20px;bottom:20px;background:#FF6B6B;box-shadow:0 3px 8px #0004}
.tb{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.tb button{background:#9B5DE51F;color:#9B5DE5;padding:6px 10px;border-radius:12px;flex:none}
.tb .sw{width:28px;height:28px;padding:0;border:1.5px solid #0003;border-radius:50%}
.ed{min-height:110px;background:#fff;border:2px solid;border-radius:20px;padding:12px;font-size:18px}
h3{color:#fff;display:inline-block;padding:4px 16px;border-radius:18px 18px 18px 0;margin:16px 0 0}
.face{border:4px solid #4D96FF;background:#DCEBFF;border-radius:32px;padding:20px;text-align:center;font-size:26px;min-height:50vh;display:flex;flex-direction:column;justify-content:center;margin:16px 0}
.face.b{border-color:#F15BB5;background:#FFDDF0}
.face small{font:800 13px system-ui;color:#2D2A4A99;margin-bottom:8px}
.sm{min-height:0;font-size:22px;margin:10px 0;opacity:.6}.sm.on{opacity:1;border-width:7px}
.c{text-align:center;padding-top:20vh}
#rd{position:fixed;inset:0;background:#0006;display:flex;padding:12px}
.box{background:#FFF8E7;border-radius:28px;padding:16px;margin:auto;width:100%;max-width:600px;max-height:100%;overflow-y:auto}
select{width:100%;font:inherit;padding:8px;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./config.js";

// ---- data: Firestore, one document per deck / card, private to the signed-in user -------------
const fb = initializeApp(firebaseConfig), auth = getAuth(fb);
const db = initializeFirestore(fb, {localCache: persistentLocalCache()});
let uid, decks = [], cards = [];
const col = n => collection(db, 'users', uid, n);
const save = (n, o) => setDoc(doc(col(n), o.id), o);
const del = (n, id) => deleteDoc(doc(col(n), id));
const byT = (a, b) => a.t - b.t;
const cardsOf = id => cards.filter(c => c.deckId == id);
onAuthStateChanged(auth, u => {
  uid = u ? u.uid : null;
  if (!u) return render();
  onSnapshot(col('decks'), s => { decks = s.docs.map(d => d.data()).sort(byT); live(); });
  onSnapshot(col('cards'), s => { cards = s.docs.map(d => d.data()).sort(byT); live(); });
});

// ---- helpers ---------------------------------------------------------------------------------
const $ = s => document.querySelector(s), app = $('#app');
const COL = ['#FF6B6B', '#4D96FF', '#3FBF6A', '#9B5DE5', '#F15BB5', '#FF9F1C'];
const EMO = ['🦄', '🌈', '🍉', '🚀', '🎨', '🐳', '🍭', '🦊', '🌻', '🎈'];
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const plain = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent.trim(); };
const shuf = a => a.sort(() => Math.random() - .5);

// Cards saved by the Android app store text as {"t":..,"s":[spans]}; turn that into HTML on restore.
const hex = v => '#' + ((v >>> 0) & 0xFFFFFF).toString(16).padStart(6, '0');
const CSS = {BOLD: 'font-weight:bold', ITALIC: 'font-style:italic', UNDERLINE: 'text-decoration:underline'};
function conv(s) {
  s = s || '';
  let o; try { o = JSON.parse(s); } catch { return s; }
  if (!o || typeof o.t != 'string') return s;
  const sp = o.s || [], t = o.t;
  const cuts = [...new Set([0, t.length, ...sp.flatMap(x => [x.a, x.b])])].filter(p => p >= 0 && p <= t.length).sort((a, b) => a - b);
  return cuts.slice(1).map((q, j) => {
    const p = cuts[j];
    const css = sp.filter(x => x.a <= p && x.b >= q).map(x => CSS[x.k] ||
      {COLOR: 'color:' + hex(x.v), HIGHLIGHT: 'background:' + hex(x.v), SIZE: 'font-size:' + x.v + 'em'}[x.k]).join(';');
    const h = esc(t.slice(p, q)).replace(/\n/g, '<br>');
    return css ? `<span style="${css}">${h}</span>` : h;
  }).join('');
}

// ---- views -----------------------------------------------------------------------------------
let run;
const head = (title, to = "home", id = '') => `<header><button data-a="${to}" data-i="${id}">←</button><h1>${esc(title)}</h1></header>`;

function decksView() {
  return `<header><h1>My Decks 🎈</h1></header>
  <div class="row bar"><button data-a="backup">💾 Backup</button>
  <label class="btn">📂 Restore<input type="file" accept=".json" data-a="restore" hidden></label></div>` +
  (decks.map((d, i) => `<div class="tile" style="background:${COL[i % 6]}" data-a="open" data-i="${d.id}">
    <span class="em">${EMO[i % 10]}</span>
    <div><b>${esc(d.title)}</b><br>${cardsOf(d.id).length} cards</div>
    <button data-a="ren" data-i="${d.id}">✏️</button><button data-a="deldeck" data-i="${d.id}">🗑</button></div>`).join('')
    || '<p class="c">No decks yet!<br>Tap “New deck” to make your first one. 🌟</p>') +
  `<button class="fab" data-a="newdeck">＋ New deck</button>`;
}

function deckView(id) {
  const d = decks.find(x => x.id == id); if (!d) return decksView();
  const cs = cardsOf(id), n = cs.filter(c => c.included).length;
  return head(d.title) + `<div class="row"><button class="mint" data-a="run" data-i="${id}" ${n ? '' : 'disabled'}>▶ Start run</button>
    <button class="sky" data-a="read" data-i="${id}">🔊 Read aloud</button></div>
    <p><b>${n} of ${cs.length} cards are in the run</b></p>` +
  cs.map((c, i) => `<div class="crow" style="border-color:${COL[i % 6]}">
    <input type="checkbox" data-a="inc" data-i="${c.id}" ${c.included ? 'checked' : ''}>
    <div data-a="edit" data-i="${c.id}"><b>${esc(plain(c.front) || '(empty front)')}</b><br>${esc(plain(c.back) || '(empty back)')}</div>
    <button data-a="delcard" data-i="${c.id}">🗑</button></div>`).join('') +
  `<button class="fab" data-a="newcard" data-i="${id}">＋ Add flashcard</button>`;
}

const T = ['#2D2A4A', '#E63946', '#FF8C00', '#2BA84A', '#1E88E5', '#8E24AA', '#EC407A'], H = ['#FFF176', '#A5D6A7', '#81D4FA', '#F8BBD0', '#FFCC80'];
const btn = (c, l, v = '') => `<button data-a="fmt" data-c="${c}" data-v="${v}">${l}</button>`;
const sw = (c, v) => `<button class="sw" data-a="fmt" data-c="${c}" data-v="${v}" style="background:${v}"></button>`;
const TB = `<div class="tb">${btn('bold', '<b>B</b>')}${btn('italic', '<i>I</i>')}${btn('underline', '<u>U</u>')}${btn('insertUnorderedList', '•≡')}
  ${btn('fontSize', 'A−', 2)}${btn('fontSize', 'A', 3)}${btn('fontSize', 'A+', 5)}${btn('fontSize', 'A++', 6)}
  ${T.map(v => sw('foreColor', v)).join('')}${H.map(v => sw('hiliteColor', v)).join('')}${btn('removeFormat', '✕')}</div>`;
const section = (id, label, color, html) => `<h3 style="background:${color}">${label}</h3>${TB}<div class="ed" id="${id}" style="border-color:${color}" contenteditable>${html || ''}</div>`;

function editView(deck, id) {
  const c = cards.find(x => x.id == id) || {};
  return head(id ? 'Edit flashcard ✏️' : 'New flashcard ✨', 'open', deck) +
    section('f', 'Front 🌟', '#4D96FF', c.front) + section('b', 'Back 🎯', '#F15BB5', c.back) + section('i', 'General info 💡', '#FF9F1C', c.info) +
    `<p><button class="mint" style="width:100%" data-a="savecard">Save card 💾</button></p>`;
}

function runView(id) {
  if (!run || run.deck != id) { run = {deck: id, pool: shuf(cardsOf(id).filter(c => c.included)), i: 0, flip: 0}; run.total = run.pool.length; }
  const p = run.pool, c = p[run.i];
  if (!c) return `<div class="c"><div style="font-size:96px">🎉</div><h1>${run.total ? 'You know all the cards!' : 'No cards are ticked for the run'}</h1>
    ${run.total ? '<p><button class="grape" style="width:100%" data-a="again">Study again 🔁</button></p>' : ''}
    <p><button class="sky" style="width:100%" data-a="open" data-i="${id}">Back to deck</button></p></div>`;
  const info = run.flip && plain(c.info) ? `<hr><small>💡 Good to know</small><div style="font-size:16px">${c.info}</div>` : '';
  return head('Study time 🚀', 'open', id) +
    `<progress style="width:100%" value="${run.total - p.length}" max="${run.total}"></progress><b> ${p.length} left to learn</b>
    <div class="face ${run.flip ? 'b' : ''}" data-a="flip"><small>${run.flip ? 'BACK' : 'FRONT'}</small>${run.flip ? c.back : c.front}${info}
    ${run.flip ? '' : '<small style="margin-top:12px">tap to flip 👆</small>'}</div>
    <div class="row"><button class="sun" data-a="next">Next ➡</button><button class="mint" data-a="know">I know this ✓</button></div>`;
}

function render() {
  if (uid === undefined) return app.innerHTML = '<p class="c">Loading…</p>';
  if (!uid) return app.innerHTML = `<div class="c"><h1>Sara's Flashcards 🎈</h1><button class="coral" data-a="login">Sign in with Google</button></div>`;
  const [, r, a, b] = location.hash.split('/');
  app.innerHTML = ({d: deckView, e: editView, r: runView}[r] || decksView)(a, b);
}
// Snapshots re-render the lists only; never while typing a card or studying.
const live = () => /^#\/[er]\//.test(location.hash) || render();

// ---- read aloud (browser speech synthesis) -----------------------------------------------------
let R, tok = 0, U;
function say(list, i) {
  speechSynthesis.cancel();
  const t = ++tok, c = list[i];
  R = {list, i, part: 0, on: true}; paint();
  const speak = (txt, next) => {
    if (!txt) return next();
    U = new SpeechSynthesisUtterance(txt);
    U.voice = speechSynthesis.getVoices().find(v => v.name == localStorage.voice) || null;
    U.onend = () => t == tok && next();
    speechSynthesis.speak(U);
  };
  const wait = (ms, f) => setTimeout(() => t == tok && f(), ms);
  const step = k => {
    if (t != tok) return;
    if (k == 0) { R.part = 1; paint(); speak(plain(c.front), () => wait(700, () => step(1))); }
    else if (k == 1) { R.part = 2; paint(); speak(plain(c.back), () => wait(1300, () => step(2))); }
    else if (i + 1 < list.length) say(list, i + 1);
    else { R.on = false; R.part = 0; R.done = 1; paint(); }
  };
  step(0);
}
function stop() { tok++; speechSynthesis.cancel(); if (R) { R.on = false; paint(); } }
function paint() {
  let o = $('#rd');
  if (!R) return o && o.remove();
  if (!o) { o = document.createElement('div'); o.id = 'rd'; document.body.append(o); }
  const c = R.list[R.i], lang = navigator.language;
  const vs = speechSynthesis.getVoices().sort((a, b) => (b.lang == lang) - (a.lang == lang) || a.lang.localeCompare(b.lang));
  o.innerHTML = `<div class="box"><h2>${R.done ? 'All done 🎉' : `Reading card ${R.i + 1} of ${R.list.length}`}</h2>
    <div class="face sm ${R.part == 1 ? 'on' : ''}"><small>FRONT</small>${c.front}</div>
    <div class="face b sm ${R.part == 2 ? 'on' : ''}"><small>BACK</small>${c.back}</div>
    <div class="row"><button data-a="prev" ${R.i ? '' : 'disabled'}>⏮</button>
    <button class="${R.on ? 'coral' : 'mint'}" data-a="play">${R.on ? '⏹ Stop' : '▶ Play'}</button>
    <button data-a="next2" ${R.i < R.list.length - 1 ? '' : 'disabled'}>⏭</button></div>
    <select data-a="voice"><option value="">Default voice</option>${vs.map(v =>
      `<option value="${esc(v.name)}" ${v.name == localStorage.voice ? 'selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select>
    <button class="sky" style="width:100%" data-a="closerd">Close</button></div>`;
}
speechSynthesis.onvoiceschanged = () => R && paint();

// ---- actions -----------------------------------------------------------------------------------
const act = {
  login: () => signInWithPopup(auth, new GoogleAuthProvider()),
  home: () => location.hash = '',
  open: id => location.hash = '#/d/' + id,
  newdeck() {
    const t = prompt('Deck title');
    if (t && t.trim()) { const id = crypto.randomUUID(); save('decks', {id, title: t.trim(), t: Date.now()}); location.hash = '#/d/' + id; }
  },
  ren(id) {
    const d = decks.find(x => x.id == id), t = prompt('Rename deck', d.title);
    if (t && t.trim()) save('decks', {...d, title: t.trim()});
  },
  deldeck(id) {
    if (confirm('Delete this deck and all its flashcards?')) { cardsOf(id).forEach(c => del('cards', c.id)); del('decks', id); }
  },
  newcard: id => location.hash = `#/e/${id}/`,
  edit: id => location.hash = `#/e/${cards.find(c => c.id == id).deckId}/${id}`,
  delcard: id => confirm('Delete this flashcard?') && del('cards', id),
  inc: (id, b) => save('cards', {...cards.find(c => c.id == id), included: b.checked}),
  fmt: (_, b) => document.execCommand(b.dataset.c, false, b.dataset.v),
  savecard() {
    const [, , deck, id] = location.hash.split('/'), f = $('#f').innerHTML, bk = $('#b').innerHTML;
    if (!plain(f) && !plain(bk)) return alert('Write something on the front or back first!');
    const old = cards.find(c => c.id == id);
    save('cards', {id: id || crypto.randomUUID(), deckId: deck, front: f, back: bk, info: $('#i').innerHTML,
      included: old ? old.included : true, t: old ? old.t : Date.now()});
    location.hash = '#/d/' + deck;
  },
  run: id => { run = null; location.hash = '#/r/' + id; },
  again: () => { run = null; render(); },
  flip: () => { run.flip ^= 1; render(); },
  next() { run.i = (run.i + 1) % run.pool.length; if (!run.i) shuf(run.pool); run.flip = 0; render(); },
  know() {
    run.pool.splice(run.i, 1);
    if (run.i >= run.pool.length) { run.i = 0; shuf(run.pool); }
    run.flip = 0; render();
  },
  read(id) {
    const l = cardsOf(id).filter(c => plain(c.front) || plain(c.back));
    if (l.length) say(l, 0);
  },
  prev: () => say(R.list, R.i - 1),
  next2: () => say(R.list, R.i + 1),
  play: () => R.on ? stop() : say(R.list, R.done ? 0 : R.i),
  voice(v) { localStorage.voice = v; if (R.on) say(R.list, R.i); },
  closerd() { stop(); R = null; paint(); },
  backup() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({decks, cards})], {type: 'application/json'}));
    a.download = 'saras-flashcards-backup.json'; a.click();
  },
  async restore(_, t) {
    try {
      const o = JSON.parse(await t.files[0].text()), n = Date.now();
      o.decks.forEach((d, i) => save('decks', {id: d.id, title: d.title, t: d.t || n + i}));
      o.cards.forEach((c, i) => save('cards', {id: c.id, deckId: c.deckId, front: conv(c.front), back: conv(c.back),
        info: conv(c.info), included: c.included !== false, t: c.t || n + i}));
      alert(`Restored ✅ (${o.cards.length} cards)`);
    } catch { alert("That file isn't a flashcards backup."); }
    t.value = '';
  },
};
document.onclick = e => {
  const b = e.target.closest('[data-a]');
  if (b && b.tagName != 'SELECT' && b.type != 'file') act[b.dataset.a](b.dataset.i, b);
};
document.onchange = e => { const t = e.target; if (t.dataset.a) act[t.dataset.a](t.value, t); };
document.onmousedown = e => e.target.closest('.tb') && e.preventDefault(); // keep the text selection when tapping the toolbar
document.onfocusin = () => document.execCommand('styleWithCSS', false, true);
document.onpaste = e => { // paste as plain text so no foreign HTML gets in
  if (e.target.closest('.ed')) { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); }
};
window.onhashchange = () => { if (R) { stop(); R = null; paint(); } render(); scrollTo(0, 0); };

if (/^#\/[er]\//.test(location.hash)) location.hash = ''; // a reload can't resume an edit or a run
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
